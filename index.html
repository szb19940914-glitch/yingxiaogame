<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>2048 - 二合游戏 Pro</title>
<style>
  :root {
    --bg: linear-gradient(135deg, #faf8ef 0%, #f5e9c7 100%);
    --fg: #776e65;
    --board: #bbada0;
    --cell: rgba(238,228,218,.35);
    --score-bg: #bbada0;
    --score-fg: #fff;
    --btn-bg: #8f7a66;
    --btn-fg: #f9f6f2;
    --overlay: rgba(238,228,218,.73);
    --gap: 12px;
  }
  [data-theme="dark"] {
    --bg: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    --fg: #e0e0e0;
    --board: #2a2a3e;
    --cell: rgba(255,255,255,.05);
    --score-bg: #3a3a5e;
    --score-fg: #fff;
    --btn-bg: #4a4a7e;
    --btn-fg: #fff;
    --overlay: rgba(20,20,40,.85);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg);
    user-select: none; overflow: hidden;
    transition: background .3s, color .3s;
  }
  body { display: flex; align-items: center; justify-content: center; padding: 12px; }
  .app { width: 100%; max-width: 480px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  h1 { font-size: 48px; font-weight: 800; letter-spacing: -1px; }
  .scores { display: flex; gap: 6px; }
  .score-box {
    background: var(--score-bg); color: var(--score-fg); border-radius: 6px;
    padding: 6px 14px; min-width: 70px; text-align: center; position: relative;
  }
  .score-box .label { font-size: 10px; text-transform: uppercase; opacity: .8; font-weight: 700; letter-spacing: 1px; }
  .score-box .value { font-size: 20px; font-weight: 700; }
  .score-add {
    position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
    color: rgba(119,110,101,.9); font-weight: 800; font-size: 18px;
    pointer-events: none; opacity: 0;
  }
  .score-add.show { animation: scoreAdd .6s ease-out; }
  @keyframes scoreAdd {
    0% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -28px); }
  }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .toolbar p { flex: 1; min-width: 160px; font-size: 13px; line-height: 1.4; }
  .btn, select {
    background: var(--btn-bg); color: var(--btn-fg); border: none;
    padding: 8px 14px; border-radius: 6px; font-weight: 700;
    cursor: pointer; font-size: 13px; transition: filter .15s, transform .1s;
    font-family: inherit;
  }
  .btn:hover, select:hover { filter: brightness(1.1); }
  .btn:active { transform: scale(.95); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .icon-btn { padding: 8px 10px; }

  .board-wrap {
    position: relative; background: var(--board); border-radius: 8px;
    padding: var(--gap); aspect-ratio: 1 / 1; width: 100%;
    touch-action: none; overflow: hidden;
  }
  .grid, .tiles { position: absolute; inset: var(--gap); }
  .grid {
    display: grid;
    grid-template-columns: repeat(var(--n), 1fr);
    grid-template-rows: repeat(var(--n), 1fr);
    gap: var(--gap);
  }
  .cell { background: var(--cell); border-radius: 6px; }
  .tile {
    position: absolute;
    width: calc((100% - (var(--n) - 1) * var(--gap)) / var(--n));
    height: calc((100% - (var(--n) - 1) * var(--gap)) / var(--n));
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 36px;
    transition: transform .14s ease-in-out;
    will-change: transform;
  }
  .tile.spawn { animation: pop .18s ease .05s both; }
  .tile.merged { animation: merge .22s ease; z-index: 2; }
  @keyframes pop {
    0%   { transform: translate(var(--tx), var(--ty)) scale(0); }
    100% { transform: translate(var(--tx), var(--ty)) scale(1); }
  }
  @keyframes merge {
    0%   { transform: translate(var(--tx), var(--ty)) scale(1); }
    50%  { transform: translate(var(--tx), var(--ty)) scale(1.2); }
    100% { transform: translate(var(--tx), var(--ty)) scale(1); }
  }

  .t-2    { background: #eee4da; color: #776e65; }
  .t-4    { background: #ede0c8; color: #776e65; }
  .t-8    { background: #f2b179; color: #f9f6f2; }
  .t-16   { background: #f59563; color: #f9f6f2; }
  .t-32   { background: #f67c5f; color: #f9f6f2; }
  .t-64   { background: #f65e3b; color: #f9f6f2; }
  .t-128  { background: #edcf72; color: #f9f6f2; box-shadow: 0 0 16px rgba(243,215,116,.4); }
  .t-256  { background: #edcc61; color: #f9f6f2; box-shadow: 0 0 18px rgba(243,215,116,.5); }
  .t-512  { background: #edc850; color: #f9f6f2; box-shadow: 0 0 20px rgba(243,215,116,.55); }
  .t-1024 { background: #edc53f; color: #f9f6f2; box-shadow: 0 0 22px rgba(243,215,116,.6); }
  .t-2048 { background: #edc22e; color: #f9f6f2; box-shadow: 0 0 28px rgba(243,215,116,.75); }
  .t-super{ background: #3c3a32; color: #f9f6f2; }

  .overlay {
    position: absolute; inset: var(--gap); border-radius: 6px;
    background: var(--overlay);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 10; gap: 14px;
    backdrop-filter: blur(4px);
  }
  .overlay.show { display: flex; }
  .overlay h2 { font-size: 44px; }
  .overlay.win { background: rgba(237,194,46,.65); }
  .overlay.win h2 { color: #f9f6f2; }

  .particles {
    position: absolute; inset: 0; pointer-events: none; z-index: 5; overflow: hidden;
  }
  .particle {
    position: absolute; width: 8px; height: 8px; border-radius: 50%;
    pointer-events: none; will-change: transform, opacity;
  }

  footer { margin-top: 12px; font-size: 12px; line-height: 1.5; opacity: .85; }
  footer kbd {
    background: var(--score-bg); color: var(--score-fg); padding: 1px 5px;
    border-radius: 3px; font-size: 10px; font-family: inherit;
  }

  @media (max-width: 420px) {
    h1 { font-size: 36px; }
    .tile { font-size: 28px; }
  }
  /* dynamic font size by tile value computed in JS via class */
  .tile[data-len="3"] { font-size: 0.85em; }
  .tile[data-len="4"] { font-size: 0.7em; }
  .tile[data-len="5"] { font-size: 0.6em; }
  .tile[data-len="6"] { font-size: 0.5em; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>2048</h1>
    <div class="scores">
      <div class="score-box">
        <div class="label">分数</div>
        <div class="value" id="score">0</div>
        <div class="score-add" id="score-add">+0</div>
      </div>
      <div class="score-box">
        <div class="label">最高</div>
        <div class="value" id="best">0</div>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <p>合并相同数字，目标 <b>2048</b>！</p>
    <select id="size-select" title="棋盘大小">
      <option value="3">3×3</option>
      <option value="4" selected>4×4</option>
      <option value="5">5×5</option>
      <option value="6">6×6</option>
    </select>
    <button class="btn icon-btn" id="undo" title="撤销 (U)">↶ 撤销</button>
    <button class="btn icon-btn" id="theme" title="切换主题">🌙</button>
    <button class="btn icon-btn" id="sound" title="音效">🔊</button>
    <button class="btn" id="restart">重开</button>
  </div>

  <div class="board-wrap" id="board" style="--n:4;">
    <div class="grid" id="grid"></div>
    <div class="tiles" id="tiles"></div>
    <div class="particles" id="particles"></div>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">游戏结束</h2>
      <div style="display:flex;gap:10px;">
        <button class="btn" id="overlay-continue" style="display:none;">继续挑战</button>
        <button class="btn" id="overlay-btn">再来一局</button>
      </div>
    </div>
  </div>

  <footer>
    <p>键盘 <kbd>↑↓←→</kbd> 或 <kbd>WASD</kbd> 移动；<kbd>U</kbd> 撤销；移动端滑动操作。</p>
  </footer>
</div>

<script>
(() => {
  // ===== State =====
  let N = +(localStorage.getItem('size2048') || 4);
  const TRANSITION_MS = 140;
  let grid = [];                 // [r][c] -> tile | null
  let tilesById = new Map();
  let nextId = 1;
  let score = 0;
  let best = +(localStorage.getItem('best2048_' + N) || 0);
  let won = false, keepPlaying = false, over = false;
  let animating = false;
  let history = [];              // for undo
  let theme = localStorage.getItem('theme2048') || 'light';
  let soundOn = localStorage.getItem('sound2048') !== 'off';

  // ===== DOM =====
  const $ = id => document.getElementById(id);
  const tilesEl = $('tiles'), gridEl = $('grid'), board = $('board');
  const scoreEl = $('score'), bestEl = $('best'), scoreAddEl = $('score-add');
  const overlay = $('overlay'), overlayTitle = $('overlay-title');
  const overlayBtn = $('overlay-btn'), overlayContinue = $('overlay-continue');
  const undoBtn = $('undo'), themeBtn = $('theme'), soundBtn = $('sound');
  const sizeSelect = $('size-select'), particlesEl = $('particles');

  // ===== Audio (WebAudio synth) =====
  let audioCtx = null;
  function beep(freq = 440, dur = 0.08, type = 'sine', vol = 0.15) {
    if (!soundOn) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.value = vol;
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g).connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }
  const sfx = {
    move:  () => beep(220, 0.04, 'square', 0.05),
    merge: v => beep(330 + Math.log2(v) * 40, 0.1, 'triangle', 0.12),
    win:   () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'sine', 0.15), i * 120)); },
    over:  () => { [330, 247, 196].forEach((f, i) => setTimeout(() => beep(f, 0.2, 'sawtooth', 0.12), i * 150)); }
  };

  // ===== Theme =====
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', theme);
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
  themeBtn.onclick = () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('theme2048', theme); applyTheme();
  };
  soundBtn.onclick = () => {
    soundOn = !soundOn;
    localStorage.setItem('sound2048', soundOn ? 'on' : 'off');
    soundBtn.textContent = soundOn ? '🔊' : '🔇';
  };

  // ===== Grid utils =====
  const empty = () => Array.from({length: N}, () => Array(N).fill(null));

  function setSize(n) {
    N = n;
    localStorage.setItem('size2048', N);
    board.style.setProperty('--n', N);
    gridEl.innerHTML = '';
    for (let i = 0; i < N * N; i++) {
      const c = document.createElement('div'); c.className = 'cell';
      gridEl.appendChild(c);
    }
    best = +(localStorage.getItem('best2048_' + N) || 0);
    bestEl.textContent = best;
    init();
  }

  function tileClass(v) { return v <= 2048 ? `t-${v}` : 't-super'; }

  function addRandom() {
    const empties = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!grid[r][c]) empties.push([r, c]);
    if (!empties.length) return null;
    const [r, c] = empties[Math.floor(Math.random() * empties.length)];
    const value = Math.random() < 0.9 ? 2 : 4;
    const tile = { id: nextId++, value, r, c, isNew: true };
    grid[r][c] = tile;
    tilesById.set(tile.id, tile);
    return tile;
  }

  function snapshot() {
    return {
      grid: grid.map(row => row.map(t => t ? { id: t.id, value: t.value, r: t.r, c: t.c } : null)),
      score, won, keepPlaying, over, nextId
    };
  }
  function restore(snap) {
    // rebuild tiles map preserving DOM where possible
    const oldTiles = tilesById;
    tilesById = new Map();
    grid = empty();
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const s = snap.grid[r][c];
      if (!s) continue;
      let t = oldTiles.get(s.id);
      if (t) { oldTiles.delete(s.id); t.value = s.value; t.r = r; t.c = c; }
      else { t = { id: s.id, value: s.value, r, c }; }
      grid[r][c] = t; tilesById.set(s.id, t);
    }
    // remove DOM of tiles that are gone
    for (const t of oldTiles.values()) if (t.el && t.el.parentNode) t.el.parentNode.removeChild(t.el);
    score = snap.score; won = snap.won; keepPlaying = snap.keepPlaying;
    over = snap.over; nextId = snap.nextId;
    overlay.classList.remove('show', 'win');
    updateScore(0);
    render();
  }

  // ===== Render =====
  function positionTile(tile) {
  function positionTile(tile) {
    const tx = `calc((100% + var(--gap)) * ${tile.c})`;
    const ty = `calc((100% + var(--gap)) * ${tile.r})`;
    tile.el.style.setProperty('--tx', tx);
    tile.el.style.setProperty('--ty', ty);
    tile.el.style.transform = `translate(${tx}, ${ty})`;
  }
    tile.el.style.setProperty('--tx', tx);
    tile.el.style.setProperty('--ty', ty);
    tile.el.style.transform = `translate(${tx}, ${ty})`;
  }

  function render() {
    for (const tile of tilesById.values()) {
      if (!tile.el) {
        const el = document.createElement('div');
        el.className = 'tile';
        tile.el = el;
        tilesEl.appendChild(el);
      }
      tile.el.className = `tile ${tileClass(tile.value)}`;
      tile.el.textContent = tile.value;
      tile.el.dataset.len = String(tile.value).length;
      positionTile(tile);
      if (tile.isNew) {
        tile.el.classList.add('spawn');
        tile.isNew = false;
        setTimeout(() => tile.el && tile.el.classList.remove('spawn'), 240);
      }
      if (tile.justMerged) {
        tile.el.classList.add('merged');
        tile.justMerged = false;
        setTimeout(() => tile.el && tile.el.classList.remove('merged'), 240);
      }
    }
  }

  function removeTile(tile) {
    if (tile.el && tile.el.parentNode) tile.el.parentNode.removeChild(tile.el);
    tilesById.delete(tile.id);
  }

  function updateScore(delta = 0) {
    scoreEl.textContent = score;
    if (delta > 0) {
      scoreAddEl.textContent = '+' + delta;
      scoreAddEl.classList.remove('show');
      void scoreAddEl.offsetWidth;
      scoreAddEl.classList.add('show');
    }
    if (score > best) {
      best = score;
      localStorage.setItem('best2048_' + N, best);
      bestEl.textContent = best;
    }
  }

  // ===== Particles =====
  function burst(r, c, color = '#edc22e') {
    const rect = board.getBoundingClientRect();
    const cellSize = (rect.width - 2 * 12) / N;
    const cx = 12 + c * (cellSize + 12) + cellSize / 2;
    const cy = 12 + r * (cellSize + 12) + cellSize / 2;
    for (let i = 0; i < 12; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = cx + 'px'; p.style.top = cy + 'px';
      p.style.background = color;
      const angle = (Math.PI * 2 * i) / 12 + Math.random() * 0.3;
      const dist = 30 + Math.random() * 30;
      const dx = Math.cos(angle) * dist, dy = Math.sin(angle) * dist;
      particlesEl.appendChild(p);
      p.animate(
        [
          { transform: 'translate(0,0) scale(1)', opacity: 1 },
          { transform: `translate(${dx}px, ${dy}px) scale(0)`, opacity: 0 }
        ],
        { duration: 500 + Math.random() * 200, easing: 'cubic-bezier(.4,.8,.6,1)' }
      ).onfinish = () => p.remove();
    }
  }

  // ===== Move logic (clean classic algorithm) =====
  // direction vectors
  const DIRS = { up:[-1,0], down:[1,0], left:[0,-1], right:[0,1] };

  function traverseOrder(dr, dc) {
    const rs = [...Array(N).keys()];
    const cs = [...Array(N).keys()];
    if (dr > 0) rs.reverse();
    if (dc > 0) cs.reverse();
    return { rs, cs };
  }

  function findFarthest(r, c, dr, dc) {
    let pr = r, pc = c;
    while (true) {
      const nr = pr + dr, nc = pc + dc;
      if (nr < 0 || nr >= N || nc < 0 || nc >= N) break;
      if (grid[nr][nc]) return { far: [pr, pc], next: grid[nr][nc] };
      pr = nr; pc = nc;
    }
    return { far: [pr, pc], next: null };
  }

  function move(direction) {
    if (animating || over) return;
    const [dr, dc] = DIRS[direction];
    const snap = snapshot();
    let moved = false, gained = 0;
    const mergeEvents = []; // {fromTile, intoTile, r, c, value}

    // reset merged flags
    for (const t of tilesById.values()) t.merged = false;

    const { rs, cs } = traverseOrder(dr, dc);
    for (const r of rs) for (const c of cs) {
      const tile = grid[r][c];
      if (!tile) continue;
      const { far, next } = findFarthest(r, c, dr, dc);
      if (next && next.value === tile.value && !next.merged) {
        // merge tile into next
        next.value *= 2;
        next.merged = true;
        next.justMerged = true;
        gained += next.value;
        score += next.value;
        // animate tile to next's position then remove
        grid[r][c] = null;
        tile.r = next.r; tile.c = next.c;
        positionTile(tile);
        mergeEvents.push({ fromTile: tile, intoTile: next });
        moved = true;
        if (next.value === 2048 && !won && !keepPlaying) won = true;
      } else {
        const [fr, fc] = far;
        if (fr !== r || fc !== c) {
          grid[r][c] = null;
          grid[fr][fc] = tile;
          tile.r = fr; tile.c = fc;
          moved = true;
        }
      }
    }

    if (!moved) return;

    history.push(snap);
    if (history.length > 50) history.shift();
    undoBtn.disabled = false;

    animating = true;
    sfx.move();
    render();

    // After slide finishes: remove merged-from tiles, spawn merge anim & particles, add new tile
    setTimeout(() => {
      for (const ev of mergeEvents) {
        removeTile(ev.fromTile);
        sfx.merge(ev.intoTile.value);
        const color = getComputedStyle(ev.intoTile.el).backgroundColor;
        burst(ev.intoTile.r, ev.intoTile.c, color);
      }
      addRandom();
      render();
      updateScore(gained);
      animating = false;

      if (won) {
        sfx.win();
        // 2048 fireworks
        for (let i = 0; i < 5; i++) setTimeout(() => burst(Math.floor(Math.random()*N), Math.floor(Math.random()*N), '#edc22e'), i * 120);
        setTimeout(() => {
          overlay.classList.add('show', 'win');
          overlayTitle.textContent = '你赢了！🎉';
          overlayContinue.style.display = '';
        }, 200);
      } else if (!hasMoves()) {
        over = true;
        sfx.over();
        setTimeout(() => {
          overlay.classList.add('show');
          overlayTitle.textContent = '游戏结束';
          overlayContinue.style.display = 'none';
        }, 200);
      }
    }, TRANSITION_MS);
  }

  function hasMoves() {
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (!grid[r][c]) return true;
      const v = grid[r][c].value;
      if (r+1 < N && grid[r+1][c] && grid[r+1][c].value === v) return true;
      if (c+1 < N && grid[r][c+1] && grid[r][c+1].value === v) return true;
    }
    return false;
  }

  // ===== Init / Undo =====
  function init() {
    grid = empty();
    for (const t of tilesById.values()) if (t.el && t.el.parentNode) t.el.parentNode.removeChild(t.el);
    tilesById.clear();
    score = 0; won = false; keepPlaying = false; over = false; animating = false;
    history = [];
    undoBtn.disabled = true;
    overlay.classList.remove('show', 'win');
    overlayContinue.style.display = 'none';
    addRandom(); addRandom();
    render();
    updateScore();
  }

  function undo() {
    if (!history.length || animating) return;
    const snap = history.pop();
    restore(snap);
    if (!history.length) undoBtn.disabled = true;
  }

  // ===== Input =====
  const KEYMAP = {
    ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
    w:'up', s:'down', a:'left', d:'right',
    W:'up', S:'down', A:'left', D:'right'
  };
  window.addEventListener('keydown', e => {
    if (e.key === 'u' || e.key === 'U') { e.preventDefault(); undo(); return; }
    const dir = KEYMAP[e.key];
    if (dir) { e.preventDefault(); move(dir); }
  });

  let touchStart = null;
  board.addEventListener('touchstart', e => {
    const t = e.touches[0]; touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  board.addEventListener('touchmove', e => { e.preventDefault(); }, { passive: false });
  board.addEventListener('touchend', e => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (Math.max(ax, ay) < 30) { touchStart = null; return; }
    if (ax > ay) move(dx > 0 ? 'right' : 'left'); else move(dy > 0 ? 'down' : 'up');
    touchStart = null;
  });

  // ===== Buttons =====
  $('restart').onclick = init;
  undoBtn.onclick = undo;
  overlayBtn.onclick = init;
  overlayContinue.onclick = () => { keepPlaying = true; overlay.classList.remove('show', 'win'); };
  sizeSelect.onchange = e => setSize(+e.target.value);

  // ===== Boot =====
  applyTheme();
  soundBtn.textContent = soundOn ? '🔊' : '🔇';
  sizeSelect.value = String(N);
  setSize(N);
})();
</script>
</body>
</html>
