<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>欢乐找不同 · 网盘豪礼</title>
<style>
  :root{
    --orange:#ff782b;
    --orange-deep:#e4441d;
    --cream:#fff1cd;
    --ink:#4c1b12;
    --brown:#7b2d19;
    --teal:#22c5c8;
    --gold:#ffd56a;
    --shadow:0 10px 24px rgba(122,38,11,.25);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#ff7a2e;color:var(--ink)}
  body{display:flex;justify-content:center;background:
    radial-gradient(circle at 18% 8%,rgba(255,218,121,.7) 0 9%,transparent 10%),
    radial-gradient(circle at 88% 3%,rgba(255,198,96,.48) 0 12%,transparent 13%),
    linear-gradient(180deg,#ff7b2e 0%,#ff6b24 48%,#f4511f 100%)}
  .phone{width:100%;max-width:430px;min-height:100vh;position:relative;overflow:hidden;padding-bottom:18px}
  .phone:before{content:"";position:absolute;inset:0;background-image:linear-gradient(30deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:24px 24px;pointer-events:none}
  .topbar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#fff;position:relative;z-index:2}
  .icon-btn{width:34px;height:34px;border:0;border-radius:50%;background:rgba(99,39,17,.35);color:#fff;font-size:22px;font-weight:900;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
  .title{position:relative;z-index:1;text-align:center;padding:4px 24px 0}
  .title h1{font-size:47px;line-height:.96;letter-spacing:1px;color:#fff6d6;text-shadow:0 3px 0 #842413,0 6px 0 #5e170e,0 8px 16px rgba(82,12,2,.35);font-weight:1000}
  .game-card{position:relative;margin:18px 16px 0;background:linear-gradient(180deg,#fff5d6,#ffe4ac);border:3px solid #8d3a1b;border-radius:18px;box-shadow:var(--shadow);padding:0 9px 16px}
  .tabs{height:47px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;margin:-3px 34px 8px;background:#ffd89d;border:2px solid rgba(141,58,27,.28);border-bottom:0;border-radius:0 0 18px 18px;overflow:hidden;transform:translateY(-1px)}
  .tab{border:0;background:transparent;height:100%;font-size:18px;font-weight:900;color:#7e2b1a;position:relative}
  .tab.active{background:#fff4d4;border-radius:0 0 16px 16px;color:#5a150e;box-shadow:0 4px 0 rgba(255,255,255,.45) inset}
  .scene-wrap{position:relative;border:2px solid #5a2718;border-radius:12px;overflow:hidden;background:#222;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
  .scene{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
  .progress-ribbon{position:absolute;left:0;right:0;bottom:0;background:rgba(34,20,13,.78);color:#fff;font-size:20px;font-weight:900;text-align:center;padding:8px 0;letter-spacing:.5px}
  .hotspot{position:absolute;width:36px;height:36px;margin:-18px;border:3px solid #fff2a3;border-radius:50%;background:rgba(246,69,32,.28);box-shadow:0 0 0 3px #e6341b,0 0 18px rgba(255,255,255,.8);transform:scale(0);opacity:0;transition:.25s}
  .hotspot.found{transform:scale(1);opacity:1;animation:pulse 1.2s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 8px rgba(230,52,27,.2),0 0 20px rgba(255,255,255,.9)}}
  .chance-row{display:grid;grid-template-columns:72px 1fr 72px;gap:8px;align-items:center;margin:12px 0 0}
  .side-task{border:0;background:transparent;color:#8c2415;font-size:15px;font-weight:1000;text-shadow:0 1px #fff;text-align:center}
  .side-task .badge{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 2px;border-radius:50%;background:linear-gradient(#ffeaa6,#ffb348);border:3px solid #9d3717;box-shadow:0 4px 0 #d4511c;color:#b82c17;font-size:25px}
  .play-btn{border:0;border-radius:25px;padding:13px 8px;background:linear-gradient(180deg,#63f1df,#10aab6);color:#fff;font-size:22px;font-weight:1000;letter-spacing:1px;text-shadow:0 2px #087780;box-shadow:0 5px 0 #077f83,0 8px 16px rgba(6,104,103,.35),inset 0 2px 0 rgba(255,255,255,.65)}
  .play-btn:disabled{filter:grayscale(.45);opacity:.78}
  .hint-strip{position:relative;margin:10px 38px -28px;z-index:2;background:linear-gradient(180deg,#ff6531,#e53d1e);border-radius:0 0 18px 18px;color:#fff4cc;text-align:center;padding:11px 8px 14px;font-size:17px;font-weight:900;box-shadow:0 6px 0 rgba(128,32,14,.2)}
  .mall{position:relative;margin:0 16px;background:#fff5df;border-radius:15px;box-shadow:var(--shadow);padding:46px 12px 14px}
  .search-row{display:flex;gap:10px;align-items:center;margin-bottom:12px}
  .search{flex:1;background:#fff;border-radius:22px;height:42px;display:flex;align-items:center;gap:8px;padding:0 14px;color:#b7aaa2;font-size:16px;box-shadow:inset 0 1px 3px rgba(0,0,0,.06)}
  .grid-icon{font-size:24px;color:#6b351f}
  .filters{display:flex;gap:8px;margin-bottom:12px;overflow:hidden}
  .filter{flex:1;min-width:max-content;border:0;border-radius:18px;padding:8px 12px;background:#ffe1bc;color:#7b2d19;font-size:16px;font-weight:800}
  .filter.active{background:#ef4a25;color:#fff;box-shadow:0 3px 0 #b52d16}
  .goods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .goods-card{border:0;background:#fff;border-radius:12px;padding:8px;display:grid;grid-template-columns:45% 1fr;gap:8px;text-align:left;box-shadow:0 4px 12px rgba(121,54,20,.12);min-height:96px;position:relative;overflow:hidden}
  .goods-card:after{content:"领机会";position:absolute;right:8px;bottom:7px;background:#ef4a25;color:#fff;border-radius:12px;padding:3px 8px;font-size:12px;font-weight:900}
  .pic{border-radius:9px;background:linear-gradient(135deg,#f3cf8f,#fff1d2);display:grid;place-items:center;font-size:34px;min-height:78px}
  .goods-title{font-size:14px;line-height:1.25;font-weight:800;color:#32170f;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .price{color:#dd2f1d;font-size:19px;font-weight:1000;margin-top:5px}.buyer{font-size:12px;color:#8a7b70;margin-top:2px}
  .toast,.modal{position:fixed;left:50%;transform:translateX(-50%);z-index:20}.toast{top:78px;background:rgba(52,24,12,.86);color:#fff;border-radius:22px;padding:9px 16px;font-weight:800;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%) translateY(8px)}
  .modal{top:22%;width:min(340px,86vw);background:#fff8df;border:3px solid #8b3218;border-radius:20px;padding:22px;text-align:center;box-shadow:0 20px 60px rgba(83,24,6,.45);display:none}.modal.show{display:block;animation:pop .25s ease}.modal h2{font-size:28px;color:#d93c1f}.modal p{margin:10px 0 16px;line-height:1.5}.modal button{border:0;border-radius:20px;background:#ef4a25;color:#fff;padding:10px 24px;font-weight:900;font-size:16px}
  @keyframes pop{from{transform:translateX(-50%) scale(.8);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
  @media (max-width:380px){.title h1{font-size:40px}.progress-ribbon{font-size:17px}.play-btn{font-size:19px}.goods-card{grid-template-columns:42% 1fr}.goods-title{font-size:13px}}
</style>
</head>
<body>
<main class="phone">
  <div class="topbar"><button class="icon-btn">‹</button><button class="icon-btn">⋮</button></div>
  <section class="title"><h1>欢乐找不同<br>赢网盘豪礼</h1></section>

  <section class="game-card">
    <div class="tabs">
      <button class="tab active" data-era="80年代">80年代</button>
      <button class="tab" data-era="90年代">90年代</button>
      <button class="tab" data-era="千禧年">千禧年</button>
    </div>
    <div class="scene-wrap" id="sceneWrap">
      <img class="scene" src="images/find-difference-no-compare-v4.png" alt="找不同街区玩法图">
      <button class="hotspot" data-id="radio" style="left:23%;top:45%" aria-label="收音机不同点"></button>
      <button class="hotspot" data-id="sign" style="left:39%;top:40%" aria-label="招牌不同点"></button>
      <button class="hotspot" data-id="drone" style="left:61%;top:34%" aria-label="无人机不同点"></button>
      <button class="hotspot" data-id="phone" style="left:65%;top:57%" aria-label="手机不同点"></button>
      <button class="hotspot" data-id="rider" style="left:87%;top:61%" aria-label="骑手不同点"></button>
      <button class="hotspot" data-id="shop" style="left:82%;top:43%" aria-label="店铺招牌不同点"></button>
      <div class="progress-ribbon">找到<span id="foundCount">0</span>/6个不同点，最高赢SVIP会员</div>
    </div>
    <div class="chance-row">
      <button class="side-task" id="checkin"><span class="badge">▣</span>签到有奖</button>
      <button class="play-btn" id="playBtn">剩余寻找机会 <span id="chanceCount">3</span>次</button>
      <button class="side-task" id="getChance"><span class="badge">◔</span>得机会</button>
    </div>
  </section>

  <div class="hint-strip">下滑寻找可获得更多「机会」</div>

  <section class="mall">
    <div class="search-row"><div class="search">⌕ <span>搜索</span></div><div class="grid-icon">☷</div></div>
    <div class="filters">
      <button class="filter active">全部</button><button class="filter">0~10元</button><button class="filter">10~100元</button><button class="filter">100~500元</button>
    </div>
    <div class="goods" id="goodsList"></div>
  </section>

  <div class="toast" id="toast">已获得1次寻找机会</div>
  <div class="modal" id="modal">
    <h2>挑战成功！</h2>
    <p>6个不同点已全部找到，获得一次SVIP抽奖资格。</p>
    <button id="againBtn">再玩一次</button>
  </div>
</main>

<script>
(() => {
  const TOTAL = 6;
  let chances = 3;
  const found = new Set();
  const goods = [
    ['🥟','秦宝好适你商托迪饼官方综合装','¥280','2239人找着'],
    ['🥤','秦里享宏任务周菜溯蒲乳糖酸','¥2.71','5060人找着'],
    ['🥖','京东佳香苦酥适配方高清统造','¥32.3','1268人找着'],
    ['📦','汽车蒙西大包角趣味豪笔代东','¥16.9','3421人找着'],
    ['🍜','金山香油果丝汤面家庭尝鲜包','¥8.8','881人找着'],
    ['🍪','酸味最大量传傍包办公室零食','¥3.6','9127人找着']
  ];
  const $ = id => document.getElementById(id);
  const foundCount = $('foundCount');
  const chanceCount = $('chanceCount');
  const playBtn = $('playBtn');
  const toast = $('toast');
  const modal = $('modal');

  function sync(){
    foundCount.textContent = found.size;
    chanceCount.textContent = chances;
    playBtn.disabled = chances <= 0;
  }
  function showToast(text){
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => toast.classList.remove('show'), 1400);
  }
  function addChance(text = '已获得1次寻找机会'){
    chances += 1;
    sync();
    showToast(text);
  }
  document.querySelectorAll('.hotspot').forEach(spot => {
    spot.addEventListener('click', e => {
      e.stopPropagation();
      if (found.has(spot.dataset.id)) return;
      if (chances <= 0) { showToast('机会用完啦，去商品区领取'); return; }
      chances -= 1;
      found.add(spot.dataset.id);
      spot.classList.add('found');
      sync();
      showToast(`找到第 ${found.size} 个不同点`);
      if (found.size === TOTAL) setTimeout(() => modal.classList.add('show'), 450);
    });
  });
  $('sceneWrap').addEventListener('click', () => {
    if (chances <= 0) showToast('机会不足，领取后继续找');
    else showToast('再仔细看看画面里的异常元素');
  });
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(item => item.classList.remove('active'));
      tab.classList.add('active');
      showToast(`${tab.dataset.era}关卡示意已切换`);
    });
  });
  $('checkin').onclick = () => addChance('签到成功，机会 +1');
  $('getChance').onclick = () => addChance('看广告得机会 +1');
  $('againBtn').onclick = () => {
    found.clear();
    chances = 3;
    document.querySelectorAll('.hotspot').forEach(spot => spot.classList.remove('found'));
    modal.classList.remove('show');
    sync();
  };
  $('goodsList').innerHTML = goods.map(([icon,title,price,buyer]) => `
    <button class="goods-card" type="button">
      <div class="pic">${icon}</div>
      <div><div class="goods-title">${title}</div><div class="price">${price}</div><div class="buyer">${buyer}</div></div>
    </button>`).join('');
  document.querySelectorAll('.goods-card').forEach(card => {
    card.addEventListener('click', () => addChance('浏览商品完成，机会 +1'));
  });
  sync();
})();
</script>
</body>
</html>
