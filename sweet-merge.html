<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Sweet Merge Pro · 甜品合成</title>
<style>
  :root{
    --bg1:#ffeef6; --bg2:#fce4ff; --bg3:#e0f2ff;
    --board:#fff7fb; --cell:#fffafd; --cell-locked:#e8d8e2;
    --cell-shadow:rgba(255,150,200,.08);
    --fg:#5a3a4a; --muted:#8a6a7a;
    --accent:#ff7eb6; --accent2:#b888ff;
    --gap:6px; --n:6;
    --candy:#ff7eb6; --bakery:#d49559; --frozen:#7ed4ff;
  }
  [data-theme="dark"]{
    --bg1:#1a0f24; --bg2:#221534; --bg3:#0f1830;
    --board:#1f1633; --cell:#251a3a; --cell-locked:#1a1228;
    --cell-shadow:rgba(0,0,0,.4); --fg:#f0e0f5; --muted:#9a8aa8;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;user-select:none;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC",sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2) 50%,var(--bg3));
    color:var(--fg);transition:background .3s,color .3s}
  body{display:flex;align-items:flex-start;justify-content:center;padding:8px;overflow-y:auto}
  .app{width:100%;max-width:540px;display:flex;flex-direction:column;gap:8px;padding-bottom:20px}
  header{display:flex;align-items:center;justify-content:space-between;gap:6px}
  h1{font-size:24px;font-weight:800;letter-spacing:-.5px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
  .stats{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
  .stat{background:rgba(255,255,255,.5);backdrop-filter:blur(6px);
    padding:4px 10px;border-radius:8px;min-width:50px;text-align:center;
    box-shadow:0 2px 6px rgba(255,150,200,.12);
    border:1px solid rgba(255,255,255,.6)}
  [data-theme="dark"] .stat{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.1)}
  .stat .l{font-size:9px;opacity:.7;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
  .stat .v{font-size:15px;font-weight:800}
  .stat.coins .v{color:#ffb000}
  .toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .toolbar .grow{flex:1;font-size:11px;opacity:.75;line-height:1.3;min-width:140px}
  .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;border:none;padding:6px 12px;border-radius:8px;font-weight:700;
    cursor:pointer;font-size:12px;box-shadow:0 3px 8px rgba(255,126,182,.35);
    transition:transform .1s,filter .15s;font-family:inherit}
  .btn:hover{filter:brightness(1.08)}
  .btn:active{transform:scale(.95)}
  .btn.ghost{background:rgba(255,255,255,.6);color:var(--fg);box-shadow:none;border:1px solid rgba(255,255,255,.7)}
  [data-theme="dark"] .btn.ghost{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.1)}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .board-wrap{position:relative;aspect-ratio:1/1;width:100%;padding:var(--gap);
    background:var(--board);border-radius:14px;
    box-shadow:0 8px 30px rgba(184,136,255,.18),inset 0 0 0 2px rgba(244,216,231,.5);
    touch-action:none}
  .grid,.items{position:absolute;inset:var(--gap)}
  .grid{display:grid;grid-template-columns:repeat(var(--n),1fr);
    grid-template-rows:repeat(var(--n),1fr);gap:var(--gap)}
  .cell{background:var(--cell);border-radius:6px;box-shadow:inset 0 1px 2px var(--cell-shadow);
    transition:background .15s,transform .15s;position:relative}
  .cell.locked{background:var(--cell-locked);display:flex;align-items:center;justify-content:center;
    flex-direction:column;cursor:pointer;font-size:10px;font-weight:700;color:var(--muted);gap:2px}
  .cell.locked:hover{background:#decad8}
  [data-theme="dark"] .cell.locked:hover{background:#28182d}
  .cell.locked .lk-icon{font-size:14px}
  .cell.locked .lk-cost{display:flex;align-items:center;gap:2px;font-size:9px}
  .cell.hover-empty{background:rgba(255,200,230,.6)}
  .cell.hover-merge{background:rgba(184,136,255,.45);transform:scale(1.05)}
  .cell.hover-bad{background:rgba(255,100,100,.25)}
  .cell.combo-flash{animation:comboFlash .5s ease}
  @keyframes comboFlash{0%,100%{background:var(--cell)}50%{background:#ffd54f}}

  .item{position:absolute;
    width:calc((100% - (var(--n) - 1) * var(--gap)) / var(--n));
    height:calc((100% - (var(--n) - 1) * var(--gap)) / var(--n));
    transition:transform .18s cubic-bezier(.34,1.4,.6,1);
    will-change:transform;cursor:grab;touch-action:none;
    display:flex;align-items:center;justify-content:center}
  .item.dragging{transition:none;cursor:grabbing;z-index:100;
    filter:drop-shadow(0 8px 16px rgba(184,136,255,.5))}
  .item.bubbled{cursor:pointer}
  .item.bubbled .art{opacity:.7}
  .item .art{width:86%;height:86%;display:flex;align-items:center;justify-content:center}
  .item svg{width:100%;height:100%;
    filter:drop-shadow(0 2px 3px rgba(90,58,74,.18))}
  .item .bubble{position:absolute;inset:5%;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9),rgba(180,220,255,.4) 60%,rgba(180,220,255,.6));
    box-shadow:inset 0 0 12px rgba(255,255,255,.6),0 0 8px rgba(180,220,255,.5);
    pointer-events:none;animation:bubbleFloat 2s ease-in-out infinite}
  @keyframes bubbleFloat{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  .item.spawn{animation:pop .35s cubic-bezier(.34,1.6,.6,1)}
  .item.merging{animation:merge .35s ease-out;z-index:50}
  .item.popping{animation:popOut .25s ease-in forwards}
  @keyframes pop{
    0%{transform:translate(var(--tx),var(--ty)) scale(0) rotate(-180deg)}
    100%{transform:translate(var(--tx),var(--ty)) scale(1) rotate(0)}}
  @keyframes merge{
    0%{transform:translate(var(--tx),var(--ty)) scale(1)}
    40%{transform:translate(var(--tx),var(--ty)) scale(1.3)}
    100%{transform:translate(var(--tx),var(--ty)) scale(1)}}
  @keyframes popOut{
    0%{transform:translate(var(--tx),var(--ty)) scale(1)}
    100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}

  .gen-row{display:flex;gap:6px;align-items:stretch;
    background:rgba(255,255,255,.5);backdrop-filter:blur(6px);
    padding:8px;border-radius:12px;border:1px solid rgba(255,255,255,.6)}
  [data-theme="dark"] .gen-row{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1)}
  .gen-btn{flex:1;border:none;border-radius:10px;cursor:pointer;
    background:linear-gradient(135deg,#fff0f8,#f0e6ff);
    box-shadow:0 3px 10px rgba(255,126,182,.25);
    padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;
    transition:transform .1s;font-family:inherit;color:var(--fg);position:relative;overflow:hidden}
  .gen-btn:hover:not(:disabled){transform:scale(1.03)}
  .gen-btn:active:not(:disabled){transform:scale(.95)}
  .gen-btn:disabled{opacity:.45;cursor:not-allowed}
  .gen-btn .icon{width:36px;height:36px}
  .gen-btn .lbl{font-size:10px;font-weight:700;opacity:.85}
  .energy-wrap{display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:90px}
  .energy-wrap .lbl{font-size:10px;opacity:.7;font-weight:700;text-align:center}
  .energy-bar{display:flex;gap:3px}
  .energy-pip{flex:1;height:14px;border-radius:4px;background:rgba(0,0,0,.08);position:relative;overflow:hidden}
  .energy-pip.full{background:linear-gradient(90deg,#ffd54f,#ffb000)}
  .energy-pip > .fill{position:absolute;inset:0;background:linear-gradient(90deg,#ffd54f,#ffb000);transform-origin:left;transform:scaleX(0)}
  .energy-text{font-size:11px;text-align:center;font-weight:700}

  .orders{display:flex;gap:6px;overflow-x:auto;padding:4px 2px;scrollbar-width:thin}
  .order-card{flex-shrink:0;min-width:120px;
    background:rgba(255,255,255,.6);backdrop-filter:blur(6px);
    border-radius:10px;padding:8px;display:flex;gap:8px;align-items:center;
    border:2px solid transparent;transition:border-color .15s,transform .15s}
  [data-theme="dark"] .order-card{background:rgba(255,255,255,.08)}
  .order-card.hover{border-color:var(--accent);transform:scale(1.05)}
  .order-card .preview{width:44px;height:44px;flex-shrink:0;
    background:var(--cell);border-radius:8px;padding:4px;display:flex;align-items:center;justify-content:center}
  .order-card .preview svg{width:100%;height:100%}
  .order-card .info{display:flex;flex-direction:column;gap:2px;font-size:11px}
  .order-card .info .name{font-weight:700;font-size:11px;line-height:1.1}
  .order-card .info .reward{color:#ffb000;font-weight:700}

  .overlay{position:absolute;inset:0;border-radius:14px;
    background:rgba(255,247,251,.9);backdrop-filter:blur(8px);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    z-index:200;gap:14px;padding:20px;text-align:center}
  [data-theme="dark"] .overlay{background:rgba(31,22,51,.92)}
  .overlay.show{display:flex}
  .overlay h2{font-size:28px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .overlay p{font-size:14px;opacity:.8}
  .particles{position:absolute;inset:0;pointer-events:none;z-index:80;overflow:hidden}
  .sparkle{position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:none}
  .float-text{position:absolute;font-weight:800;pointer-events:none;z-index:90;
    text-shadow:0 2px 4px rgba(0,0,0,.2)}
  @media (max-width:480px){h1{font-size:20px}.stat .v{font-size:13px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🍰 Sweet Merge</h1>
    <div class="stats">
      <div class="stat"><div class="l">分数</div><div class="v" id="score">0</div></div>
      <div class="stat coins"><div class="l">金币</div><div class="v" id="coins">0</div></div>
      <div class="stat"><div class="l">最高</div><div class="v" id="best">0</div></div>
    </div>
  </header>

  <div class="toolbar">
    <span class="grow">拖拽相同甜品合成 · 5 个相邻同级触发链合 · 完成订单赚金币</span>
    <button class="btn ghost" id="theme">🌙</button>
    <button class="btn ghost" id="sound">🔊</button>
    <button class="btn ghost" id="restart">重开</button>
  </div>

  <div class="board-wrap" id="board">
    <div class="grid" id="grid"></div>
    <div class="items" id="items"></div>
    <div class="particles" id="particles"></div>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">完美！</h2>
      <p id="overlay-text"></p>
      <button class="btn" id="overlay-btn">再来一局</button>
    </div>
  </div>

  <div class="gen-row" id="gen-row"></div>

  <div class="orders" id="orders"></div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="shine" cx=".3" cy=".3" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe580"/><stop offset="1" stop-color="#ffb000"/></linearGradient>
  </defs>
</svg>

<script>
(() => {
  // ============ CHAINS (3 × 6 tiers = 18 desserts) ============
  function jellybean(c){return `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="32" ry="22" fill="${c}"/><ellipse cx="40" cy="42" rx="14" ry="6" fill="url(#shine)"/></svg>`;}
  function lollipop(){return `<svg viewBox="0 0 100 100"><rect x="47" y="55" width="6" height="38" rx="3" fill="#e8e8e8"/><circle cx="50" cy="40" r="28" fill="#fff5fa"/><path d="M50 40 m-20 0 a20 20 0 1 0 40 0 a20 20 0 1 0 -40 0" fill="none" stroke="#ff5e9c" stroke-width="6" stroke-dasharray="9 9"/><ellipse cx="42" cy="30" rx="8" ry="5" fill="url(#shine)"/></svg>`;}
  function gummyworm(){return `<svg viewBox="0 0 100 100"><path d="M14 60 Q26 36 42 50 Q58 64 70 42 Q80 26 88 38" stroke="#ff7eb6" stroke-width="14" fill="none" stroke-linecap="round"/><path d="M14 60 Q26 36 42 50 Q58 64 70 42 Q80 26 88 38" stroke="#ffb3d9" stroke-width="6" fill="none" stroke-linecap="round" opacity=".7"/></svg>`;}
  function cottonCandy(){return `<svg viewBox="0 0 100 100"><rect x="47" y="60" width="6" height="32" rx="3" fill="#a87a4a"/><circle cx="35" cy="38" r="18" fill="#ff9ec9"/><circle cx="55" cy="32" r="22" fill="#ffb3d9"/><circle cx="68" cy="44" r="16" fill="#ff9ec9"/><circle cx="44" cy="50" r="14" fill="#ffd1e8"/><ellipse cx="42" cy="28" rx="8" ry="4" fill="url(#shine)"/></svg>`;}
  function caramelCluster(){return `<svg viewBox="0 0 100 100"><circle cx="32" cy="58" r="22" fill="#c47d3f"/><circle cx="62" cy="42" r="22" fill="#d49559"/><circle cx="58" cy="68" r="18" fill="#a36a35"/><ellipse cx="58" cy="36" rx="8" ry="5" fill="url(#shine)"/><ellipse cx="28" cy="52" rx="6" ry="4" fill="url(#shine)"/></svg>`;}
  function candyBox(){return `<svg viewBox="0 0 100 100"><rect x="14" y="38" width="72" height="52" rx="4" fill="#ff7eb6"/><rect x="14" y="38" width="72" height="10" fill="#b04068"/><rect x="46" y="38" width="8" height="52" fill="#b04068"/><path d="M30 38 Q30 22 50 30 Q70 22 70 38 L62 38 Q60 30 50 34 Q40 30 38 38 Z" fill="#ffb000"/><circle cx="50" cy="32" r="6" fill="#ffd54f"/><ellipse cx="32" cy="48" rx="10" ry="4" fill="url(#shine)" opacity=".5"/></svg>`;}

  function cookie(){return `<svg viewBox="0 0 100 100"><circle cx="50" cy="52" r="36" fill="#d49559"/><circle cx="50" cy="52" r="36" fill="#c47d3f" opacity=".25"/><circle cx="38" cy="40" r="5" fill="#4a2818"/><circle cx="60" cy="38" r="4" fill="#4a2818"/><circle cx="64" cy="60" r="5" fill="#4a2818"/><circle cx="42" cy="64" r="4" fill="#4a2818"/><circle cx="52" cy="52" r="3.5" fill="#4a2818"/><ellipse cx="42" cy="42" rx="12" ry="6" fill="url(#shine)" opacity=".5"/></svg>`;}
  function donut(){return `<svg viewBox="0 0 100 100"><circle cx="50" cy="52" r="36" fill="#e8b888"/><path d="M14 52 a36 36 0 0 1 72 0 L72 52 a22 22 0 0 0 -44 0 Z" fill="#ffb3d9"/><circle cx="50" cy="52" r="14" fill="#fff7fb"/><circle cx="50" cy="52" r="14" fill="#e8b888"/><path d="M14 52 a36 36 0 0 1 72 0 L72 52 a22 22 0 0 0 -44 0 Z" fill="#ffb3d9"/><circle cx="30" cy="38" r="2" fill="#ff5e9c"/><circle cx="68" cy="36" r="2" fill="#ffd54f"/><circle cx="74" cy="58" r="2" fill="#7ed4ff"/><circle cx="32" cy="64" r="2" fill="#a4e57e"/><circle cx="50" cy="30" r="2" fill="#ff5e9c"/></svg>`;}
  function cupcake(){return `<svg viewBox="0 0 100 100"><path d="M22 56 L26 92 L74 92 L78 56 Z" fill="#d49559"/><path d="M22 56 L26 64 L30 56 L34 64 L38 56 L42 64 L46 56 L50 64 L54 56 L58 64 L62 56 L66 64 L70 56 L74 64 L78 56 Z" fill="#c47d3f"/><path d="M28 56 Q28 30 50 28 Q72 30 72 56 Z" fill="#fff"/><path d="M30 56 Q30 36 50 34 Q70 36 70 56" fill="none" stroke="#ffd1e8" stroke-width="4"/><circle cx="50" cy="22" r="6" fill="#ff4d6d"/></svg>`;}
  function rollCake(){return `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="38" ry="26" fill="#fff"/><path d="M12 50 a38 26 0 0 1 76 0 a38 26 0 0 1 -76 0" fill="none" stroke="#d49559" stroke-width="3"/><ellipse cx="50" cy="50" rx="26" ry="18" fill="#ffd1e8"/><ellipse cx="50" cy="50" rx="14" ry="10" fill="#fff"/><ellipse cx="50" cy="50" rx="6" ry="4" fill="#ff5e9c"/><ellipse cx="38" cy="40" rx="14" ry="5" fill="url(#shine)"/></svg>`;}
  function macTower(){return `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="80" rx="28" ry="8" fill="#ffd1e8"/><rect x="22" y="74" width="56" height="6" fill="#fff5fa"/><ellipse cx="50" cy="64" rx="22" ry="6" fill="#a4e57e"/><rect x="28" y="60" width="44" height="4" fill="#fff5fa"/><ellipse cx="50" cy="50" rx="18" ry="5" fill="#ffd54f"/><rect x="32" y="46" width="36" height="4" fill="#fff5fa"/><ellipse cx="50" cy="36" rx="14" ry="5" fill="#7ed4ff"/><circle cx="50" cy="22" r="6" fill="#ff5e9c"/></svg>`;}
  function weddingCake(){return `<svg viewBox="0 0 100 100"><rect x="22" y="68" width="56" height="22" rx="2" fill="#fff"/><rect x="30" y="48" width="40" height="22" rx="2" fill="#fff5fa"/><rect x="38" y="28" width="24" height="22" rx="2" fill="#fff"/><path d="M22 70 Q34 76 46 70 Q58 76 70 70 Q76 73 78 70" fill="none" stroke="#ffb3d9" stroke-width="2"/><path d="M30 50 Q40 56 50 50 Q60 56 70 50" fill="none" stroke="#ffb3d9" stroke-width="2"/><path d="M38 30 Q46 35 54 30 Q60 33 62 30" fill="none" stroke="#ffb3d9" stroke-width="2"/><circle cx="34" cy="80" r="2" fill="#ff5e9c"/><circle cx="50" cy="80" r="2" fill="#ff5e9c"/><circle cx="66" cy="80" r="2" fill="#ff5e9c"/><path d="M50 28 L50 18 M46 22 L54 22" stroke="#ffd54f" stroke-width="2.5"/><circle cx="50" cy="14" r="4" fill="url(#goldGrad)"/></svg>`;}

  function iceCube(){return `<svg viewBox="0 0 100 100"><path d="M22 26 L78 26 L78 82 L22 82 Z" fill="#a4e0ff" opacity=".85"/><path d="M22 26 L78 26 L72 32 L28 32 Z" fill="#cfeeff"/><path d="M22 26 L28 32 L28 78 L22 82 Z" fill="#7ec5ee" opacity=".7"/><rect x="32" y="36" width="16" height="6" fill="#fff" opacity=".8"/><rect x="34" y="46" width="6" height="16" fill="#fff" opacity=".5"/></svg>`;}
  function popsicle(){return `<svg viewBox="0 0 100 100"><rect x="48" y="78" width="4" height="18" rx="2" fill="#a87a4a"/><rect x="30" y="14" width="40" height="68" rx="6" fill="#7ed4ff"/><rect x="34" y="20" width="14" height="22" rx="3" fill="#a4e0ff" opacity=".7"/><rect x="30" y="14" width="40" height="14" fill="#4aa3d6" opacity=".4"/></svg>`;}
  function iceBar(){return `<svg viewBox="0 0 100 100"><rect x="48" y="80" width="4" height="16" rx="2" fill="#a87a4a"/><rect x="28" y="14" width="44" height="70" rx="6" fill="#5d3a25"/><path d="M28 20 Q34 14 40 18 Q46 14 52 18 Q58 14 64 18 Q70 14 72 22 L72 24 L28 24 Z" fill="#3d2515"/><rect x="34" y="30" width="14" height="20" fill="#fff" opacity=".15"/></svg>`;}
  function sundae(){return `<svg viewBox="0 0 100 100"><path d="M28 48 L34 88 L66 88 L72 48 Z" fill="#fff" stroke="#7ed4ff" stroke-width="1.5"/><path d="M30 52 L38 84 L62 84 L70 52 Z" fill="#fce4ff" opacity=".5"/><circle cx="40" cy="40" r="14" fill="#fff5fa"/><circle cx="58" cy="36" r="14" fill="#ffd1e8"/><circle cx="50" cy="44" r="12" fill="#a4e0ff"/><path d="M50 22 L50 14 M46 20 L54 20" stroke="#a36a35" stroke-width="2"/><circle cx="50" cy="14" r="4" fill="#ff4d6d"/></svg>`;}
  function iceCone(){return `<svg viewBox="0 0 100 100"><path d="M30 50 L70 50 L50 96 Z" fill="#d49559"/><path d="M30 50 L70 50 L66 56 L34 56 Z" fill="#a36a35"/><line x1="34" y1="56" x2="42" y2="80" stroke="#a36a35" stroke-width="1"/><line x1="50" y1="56" x2="50" y2="86" stroke="#a36a35" stroke-width="1"/><line x1="66" y1="56" x2="58" y2="80" stroke="#a36a35" stroke-width="1"/><circle cx="40" cy="38" r="16" fill="#fff5e0"/><circle cx="60" cy="38" r="16" fill="#ffb3d9"/><circle cx="50" cy="22" r="14" fill="#a4d4ff"/><ellipse cx="46" cy="14" rx="6" ry="3" fill="url(#shine)"/></svg>`;}
  function iceMountain(){return `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="86" rx="36" ry="6" fill="#a87a4a"/><path d="M22 86 Q22 60 36 56 Q34 50 40 48 Q44 38 50 40 Q56 38 60 48 Q66 50 64 56 Q78 60 78 86 Z" fill="#a4e0ff"/><path d="M30 80 Q44 70 50 76 Q58 70 70 80" stroke="#fff" stroke-width="3" fill="none"/><circle cx="38" cy="56" r="6" fill="#ffd1e8"/><circle cx="62" cy="58" r="6" fill="#ff7eb6"/><circle cx="50" cy="50" r="6" fill="#ffd54f"/><path d="M50 36 L50 24 M46 30 L54 30" stroke="#a36a35" stroke-width="2"/><circle cx="50" cy="22" r="4" fill="#ff4d6d"/><path d="M30 80 L36 88 M50 82 L52 90 M70 80 L66 88" stroke="#fff" stroke-width="2"/></svg>`;}

  const CHAINS = [
    { id:'candy',  name:'糖果', color:'var(--candy)',  tiers:[
      {name:'糖豆', value:2, svg:jellybean('#ff7eb6')},
      {name:'棒棒糖', value:6, svg:lollipop()},
      {name:'软糖条', value:14, svg:gummyworm()},
      {name:'棉花糖', value:30, svg:cottonCandy()},
      {name:'焦糖糖球', value:80, svg:caramelCluster()},
      {name:'糖果礼盒', value:200, svg:candyBox()},
    ]},
    { id:'bakery', name:'烘焙', color:'var(--bakery)', tiers:[
      {name:'巧克力豆饼干', value:2, svg:cookie()},
      {name:'甜甜圈', value:6, svg:donut()},
      {name:'纸杯蛋糕', value:14, svg:cupcake()},
      {name:'蛋糕卷', value:30, svg:rollCake()},
      {name:'马卡龙塔', value:80, svg:macTower()},
      {name:'结婚蛋糕', value:200, svg:weddingCake()},
    ]},
    { id:'frozen', name:'冷饮', color:'var(--frozen)', tiers:[
      {name:'冰块', value:2, svg:iceCube()},
      {name:'棒冰', value:6, svg:popsicle()},
      {name:'雪糕', value:14, svg:iceBar()},
      {name:'圣代杯', value:30, svg:sundae()},
      {name:'冰淇淋蛋筒', value:80, svg:iceCone()},
      {name:'冰山甜品', value:200, svg:iceMountain()},
    ]},
  ];
  const TIERS_PER_CHAIN = 6;

  // ============ State ============
  const N = 6;
  const ENERGY_MAX = 5;
  const ENERGY_REGEN_MS = 4000;
  const UNLOCK_BASE_COST = 30;

  // grid: 2D of item|null. Locked cells are tracked separately
  let grid, itemsById, nextId, score, coins, best;
  let energy, lastEnergyTickAt;
  let locked;          // Set of "r,c"
  let orders;          // [{ id, chain, tier, reward }]
  let theme = localStorage.getItem('sm_theme') || 'light';
  let soundOn = localStorage.getItem('sm_sound') !== 'off';
  let stats;           // {bestTierByChain, totalMerges}

  best = +(localStorage.getItem('sm_best') || 0);

  const SAVE_KEY = 'sm_save_v1';

  // ============ DOM ============
  const $ = id => document.getElementById(id);
  const board = $('board'), gridEl = $('grid'), itemsEl = $('items');
  const scoreEl = $('score'), coinsEl = $('coins'), bestEl = $('best');
  const overlay = $('overlay'), overlayTitle = $('overlay-title'), overlayText = $('overlay-text');
  const genRow = $('gen-row'), ordersEl = $('orders'), particlesEl = $('particles');

  for (let i = 0; i < N * N; i++) {
    const c = document.createElement('div');
    c.className = 'cell'; c.dataset.r = Math.floor(i / N); c.dataset.c = i % N;
    gridEl.appendChild(c);
  }
  document.documentElement.style.setProperty('--n', N);

  // Build generators (1 per chain) + energy bar
  function buildGenRow() {
    genRow.innerHTML = '';
    CHAINS.forEach((chain, i) => {
      const b = document.createElement('button');
      b.className = 'gen-btn'; b.dataset.chain = chain.id;
      b.innerHTML = `<div class="icon">${chain.tiers[0].svg}</div><span class="lbl">${chain.name}</span>`;
      b.onclick = () => spawn(chain.id);
      genRow.appendChild(b);
    });
    const ew = document.createElement('div');
    ew.className = 'energy-wrap';
    ew.innerHTML = `<div class="lbl">⚡ 能量</div><div class="energy-bar" id="energy-bar"></div><div class="energy-text" id="energy-text">0/${ENERGY_MAX}</div>`;
    genRow.appendChild(ew);
    const bar = ew.querySelector('#energy-bar');
    for (let i = 0; i < ENERGY_MAX; i++) {
      const p = document.createElement('div'); p.className = 'energy-pip';
      p.innerHTML = '<div class="fill"></div>'; bar.appendChild(p);
    }
  }
  buildGenRow();

  // ============ Audio ============
  let actx;
  function beep(f, d=0.08, t='sine', v=0.1) {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = t; o.frequency.value = f; g.gain.value = v;
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + d);
      o.connect(g).connect(actx.destination);
      o.start(); o.stop(actx.currentTime + d);
    } catch(e) {}
  }
  const sfx = {
    spawn: () => beep(660,.08,'triangle',.08),
    pick:  () => beep(440,.04,'sine',.06),
    drop:  () => beep(330,.05,'sine',.06),
    merge: t => { beep(440+t*60,.12,'triangle',.12); setTimeout(()=>beep(660+t*80,.15,'sine',.12),80); },
    bad:   () => beep(180,.12,'sawtooth',.08),
    pop:   () => beep(880,.06,'sine',.08),
    coin:  () => { beep(1200,.06,'square',.08); setTimeout(()=>beep(1600,.06,'square',.08),60); },
    combo: () => [880,1108,1318,1760].forEach((f,i)=>setTimeout(()=>beep(f,.1,'square',.1),i*60)),
    win:   () => [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,.2,'sine',.12),i*100)),
  };

  // ============ Helpers ============
  const cellKey = (r,c) => `${r},${c}`;
  const inBounds = (r,c) => r>=0 && c>=0 && r<N && c<N;
  function emptyUnlockedCells() {
    const a = [];
    for (let r=0;r<N;r++) for (let c=0;c<N;c++)
      if (!grid[r][c] && !locked.has(cellKey(r,c))) a.push([r,c]);
    return a;
  }
  function chainIdx(id) { return CHAINS.findIndex(c => c.id === id); }
  function tierDef(chainId, tier) { return CHAINS[chainIdx(chainId)].tiers[tier]; }

  function positionItem(item) {
    const tx = `calc((100% + var(--gap)) * ${item.c})`;
    const ty = `calc((100% + var(--gap)) * ${item.r})`;
    item.el.style.setProperty('--tx', tx);
    item.el.style.setProperty('--ty', ty);
    item.el.style.transform = `translate(${tx}, ${ty})`;
  }

  function makeItem(chainId, tier, r, c, opts = {}) {
    const item = { id: opts.id || nextId++, chainId, tier, r, c, bubbled: !!opts.bubbled };
    if (opts.id) nextId = Math.max(nextId, opts.id + 1);
    grid[r][c] = item;
    const el = document.createElement('div');
    el.className = 'item' + (item.bubbled ? ' bubbled' : '');
    el.innerHTML = `<div class="art">${tierDef(chainId, tier).svg}</div>` + (item.bubbled ? '<div class="bubble"></div>' : '');
    item.el = el;
    itemsEl.appendChild(el);
    itemsById.set(item.id, item);
    positionItem(item);
    if (opts.animate) {
      el.classList.add('spawn');
      setTimeout(() => el.classList.remove('spawn'), 360);
    }
    el.addEventListener('pointerdown', e => onPointerDown(e, item));
    return item;
  }

  function unbubble(item) {
    item.bubbled = false;
    item.el.classList.remove('bubbled');
    const b = item.el.querySelector('.bubble');
    if (b) b.remove();
    sfx.pop();
    sparkle(item.r, item.c, ['#fff', '#a4e0ff', '#7ed4ff']);
  }

  function removeItem(item, animate = false) {
    if (animate && item.el) {
      item.el.classList.add('popping');
      setTimeout(() => {
        if (item.el && item.el.parentNode) item.el.parentNode.removeChild(item.el);
      }, 250);
    } else {
      if (item.el && item.el.parentNode) item.el.parentNode.removeChild(item.el);
    }
    itemsById.delete(item.id);
    if (grid[item.r][item.c] === item) grid[item.r][item.c] = null;
  }

  function flashCell(r, c) {
    const el = gridEl.children[r * N + c];
    el.classList.add('combo-flash');
    setTimeout(() => el.classList.remove('combo-flash'), 500);
  }

  function floatText(text, x, y, color = '#ffb000') {
    const el = document.createElement('div');
    el.className = 'float-text';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.color = color;
    el.style.fontSize = '16px';
    particlesEl.appendChild(el);
    el.animate(
      [{ transform:'translate(-50%,0)', opacity:1 }, { transform:'translate(-50%,-40px)', opacity:0 }],
      { duration: 800, easing:'ease-out' }
    ).onfinish = () => el.remove();
  }

  function sparkle(r, c, colors = ['#ff7eb6','#b888ff','#ffd54f','#7ed4ff','#a4e57e']) {
    const rect = board.getBoundingClientRect();
    const gap = 6;
    const size = (rect.width - 2*gap - (N-1)*gap) / N;
    const cx = gap + c * (size + gap) + size/2;
    const cy = gap + r * (size + gap) + size/2;
    for (let i = 0; i < 14; i++) {
      const p = document.createElement('div');
      p.className = 'sparkle';
      p.style.left = (cx-5) + 'px'; p.style.top = (cy-5) + 'px';
      p.style.background = colors[i % colors.length];
      p.style.boxShadow = `0 0 6px ${p.style.background}`;
      particlesEl.appendChild(p);
      const ang = (Math.PI*2*i)/14 + Math.random()*.4;
      const dist = 30 + Math.random()*40;
      p.animate(
        [{ transform:'translate(0,0) scale(1)', opacity:1 },
         { transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist}px) scale(0)`, opacity:0 }],
        { duration: 600+Math.random()*200, easing:'cubic-bezier(.4,.8,.6,1)' }
      ).onfinish = () => p.remove();
    }
  }

  // ============ Energy ============
  function tickEnergy() {
    const now = performance.now();
    if (energy < ENERGY_MAX) {
      const elapsed = now - lastEnergyTickAt;
      while (energy < ENERGY_MAX && elapsed >= ENERGY_REGEN_MS) {
        energy++;
        lastEnergyTickAt += ENERGY_REGEN_MS;
        renderEnergy();
        save();
        if (energy === ENERGY_MAX) break;
      }
    } else {
      lastEnergyTickAt = now;
    }
    renderEnergy(true);
    requestAnimationFrame(tickEnergy);
  }
  function renderEnergy(progressOnly = false) {
    const bar = $('energy-bar'), txt = $('energy-text');
    if (!bar || !txt) return;
    const pips = bar.children;
    for (let i = 0; i < ENERGY_MAX; i++) {
      pips[i].classList.toggle('full', i < energy);
      const fill = pips[i].querySelector('.fill');
      if (i === energy && energy < ENERGY_MAX) {
        const elapsed = performance.now() - lastEnergyTickAt;
        const ratio = Math.min(1, elapsed / ENERGY_REGEN_MS);
        fill.style.transform = `scaleX(${ratio})`;
      } else {
        fill.style.transform = i < energy ? 'scaleX(1)' : 'scaleX(0)';
      }
    }
    txt.textContent = `${energy}/${ENERGY_MAX}`;
    if (!progressOnly) {
      [...genRow.querySelectorAll('.gen-btn')].forEach(b => {
        b.disabled = energy < 1 || emptyUnlockedCells().length === 0;
      });
    }
  }

  // ============ Spawn ============
  function spawn(chainId) {
    if (energy < 1) { sfx.bad(); return; }
    const e = emptyUnlockedCells();
    if (!e.length) { sfx.bad(); return; }
    if (energy === ENERGY_MAX) lastEnergyTickAt = performance.now();
    energy--;
    const [r, c] = e[Math.floor(Math.random() * e.length)];
    makeItem(chainId, 0, r, c, { animate:true, bubbled:true });
    sfx.spawn();
    renderEnergy();
    save();
  }

  // ============ Drag ============
  let drag = null;
  function onPointerDown(e, item) {
    if (drag) return;
    if (item.bubbled) {
      unbubble(item);
      checkCombos(item.chainId, item.tier, [[item.r, item.c]]);
      save();
      return;
    }
    e.preventDefault();
    item.el.setPointerCapture(e.pointerId);
    const rect = item.el.getBoundingClientRect();
    drag = {
      item, pointerId: e.pointerId,
      offsetX: e.clientX - rect.left - rect.width/2,
      offsetY: e.clientY - rect.top - rect.height/2,
    };
    item.el.classList.add('dragging');
    sfx.pick();
    item.el.addEventListener('pointermove', onMove);
    item.el.addEventListener('pointerup', onUp);
    item.el.addEventListener('pointercancel', onUp);
  }
  function onMove(e) {
    if (!drag) return;
    const itemsRect = itemsEl.getBoundingClientRect();
    const x = e.clientX - itemsRect.left - drag.item.el.offsetWidth/2 - drag.offsetX;
    const y = e.clientY - itemsRect.top - drag.item.el.offsetHeight/2 - drag.offsetY;
    drag.item.el.style.transform = `translate(${x}px,${y}px)`;
    clearHover();
    const rc = pointToRC(e.clientX, e.clientY);
    if (rc) {
      const cellEl = gridEl.children[rc.r * N + rc.c];
      if (locked.has(cellKey(rc.r, rc.c))) cellEl.classList.add('hover-bad');
      else {
        const occ = grid[rc.r][rc.c];
        if (!occ) cellEl.classList.add('hover-empty');
        else if (occ !== drag.item && occ.chainId === drag.item.chainId &&
                 occ.tier === drag.item.tier && drag.item.tier < TIERS_PER_CHAIN-1 && !occ.bubbled)
          cellEl.classList.add('hover-merge');
        else if (occ !== drag.item) cellEl.classList.add('hover-bad');
      }
    }
    // Order hover detection
    [...ordersEl.querySelectorAll('.order-card')].forEach(card => card.classList.remove('hover'));
    const elem = document.elementFromPoint(e.clientX, e.clientY);
    if (elem) {
      const card = elem.closest('.order-card');
      if (card) {
        const orderId = +card.dataset.id;
        const order = orders.find(o => o.id === orderId);
        if (order && order.chain === drag.item.chainId && order.tier === drag.item.tier && !drag.item.bubbled)
          card.classList.add('hover');
      }
    }
  }
  function onUp(e) {
    if (!drag) return;
    const cur = drag; drag = null;
    cur.item.el.classList.remove('dragging');
    cur.item.el.removeEventListener('pointermove', onMove);
    cur.item.el.removeEventListener('pointerup', onUp);
    cur.item.el.removeEventListener('pointercancel', onUp);
    clearHover();
    [...ordersEl.querySelectorAll('.order-card')].forEach(card => card.classList.remove('hover'));

    // Order delivery?
    const elem = document.elementFromPoint(e.clientX, e.clientY);
    if (elem) {
      const card = elem.closest('.order-card');
      if (card) {
        const orderId = +card.dataset.id;
        const order = orders.find(o => o.id === orderId);
        if (order && order.chain === cur.item.chainId && order.tier === cur.item.tier && !cur.item.bubbled) {
          deliverOrder(order, cur.item);
          return;
        }
      }
    }

    const rc = pointToRC(e.clientX, e.clientY);
    if (!rc) { snapBack(cur.item); return; }
    if (locked.has(cellKey(rc.r, rc.c))) { sfx.bad(); snapBack(cur.item); return; }
    const target = grid[rc.r][rc.c];
    if (!target) {
      grid[cur.item.r][cur.item.c] = null;
      cur.item.r = rc.r; cur.item.c = rc.c;
      grid[rc.r][rc.c] = cur.item;
      positionItem(cur.item);
      sfx.drop();
      checkCombos(cur.item.chainId, cur.item.tier, [[cur.item.r, cur.item.c]]);
      save();
    } else if (target === cur.item) {
      snapBack(cur.item);
    } else if (target.chainId === cur.item.chainId && target.tier === cur.item.tier &&
               cur.item.tier < TIERS_PER_CHAIN-1 && !target.bubbled && !cur.item.bubbled) {
      mergeInto(cur.item, target);
    } else {
      sfx.bad();
      snapBack(cur.item);
    }
  }
  const snapBack = item => positionItem(item);

  // ============ Merge & Combo ============
  function mergeInto(src, dst) {
    grid[src.r][src.c] = null;
    src.r = dst.r; src.c = dst.c;
    positionItem(src);
    setTimeout(() => {
      const newTier = dst.tier + 1;
      removeItem(src);
      grid[dst.r][dst.c] = dst;
      dst.tier = newTier;
      dst.el.querySelector('.art').innerHTML = tierDef(dst.chainId, newTier).svg;
      dst.el.classList.add('merging');
      setTimeout(() => dst.el.classList.remove('merging'), 360);
      sfx.merge(newTier);
      sparkle(dst.r, dst.c);
      gainScore(tierDef(dst.chainId, newTier).value);
      gainCoins(tierDef(dst.chainId, newTier).value / 2 | 0);
      checkCombos(dst.chainId, newTier, [[dst.r, dst.c]]);
      checkWin();
      save();
    }, 180);
  }

  // 5+ connected items same chain+tier → all collapse into +2 tier at center
  function checkCombos(chainId, tier, seedCells) {
    if (tier >= TIERS_PER_CHAIN - 1) return;
    const visited = new Set();
    for (const [sr, sc] of seedCells) {
      const startKey = cellKey(sr, sc);
      if (visited.has(startKey)) continue;
      const it = grid[sr][sc];
      if (!it || it.bubbled || it.chainId !== chainId || it.tier !== tier) continue;
      // BFS for same chain+tier component
      const queue = [[sr, sc]];
      const comp = [];
      while (queue.length) {
        const [r, c] = queue.shift();
        const k = cellKey(r, c);
        if (visited.has(k)) continue;
        visited.add(k);
        const t = grid[r][c];
        if (!t || t.bubbled || t.chainId !== chainId || t.tier !== tier) continue;
        comp.push([r, c]);
        for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          const nr = r+dr, nc = c+dc;
          if (inBounds(nr, nc) && !visited.has(cellKey(nr, nc))) queue.push([nr, nc]);
        }
      }
      if (comp.length >= 5) {
        triggerCombo(chainId, tier, comp);
        return; // process one combo per call
      }
    }
  }

  function triggerCombo(chainId, tier, cells) {
    const targetTier = Math.min(tier + 2, TIERS_PER_CHAIN - 1);
    // Pick center (closest to centroid)
    const cy = cells.reduce((s, [r]) => s+r, 0) / cells.length;
    const cx = cells.reduce((s, [,c]) => s+c, 0) / cells.length;
    cells.sort((a,b) => (Math.abs(a[0]-cy)+Math.abs(a[1]-cx)) - (Math.abs(b[0]-cy)+Math.abs(b[1]-cx)));
    const [tr, tc] = cells[0];
    sfx.combo();
    cells.forEach(([r,c]) => flashCell(r,c));
    // Collapse all items into target position then upgrade
    const items = cells.map(([r,c]) => grid[r][c]).filter(Boolean);
    const targetItem = grid[tr][tc];
    items.forEach(it => {
      if (it === targetItem) return;
      grid[it.r][it.c] = null;
      it.r = tr; it.c = tc;
      positionItem(it);
    });
    setTimeout(() => {
      items.forEach(it => { if (it !== targetItem) removeItem(it); });
      targetItem.tier = targetTier;
      targetItem.el.querySelector('.art').innerHTML = tierDef(chainId, targetTier).svg;
      targetItem.el.classList.add('merging');
      setTimeout(() => targetItem.el.classList.remove('merging'), 360);
      grid[tr][tc] = targetItem;
      sparkle(tr, tc, ['#ffd54f','#ffb000','#fff']);
      const reward = tierDef(chainId, targetTier).value * 2;
      gainScore(reward);
      gainCoins(reward);
      const rect = board.getBoundingClientRect();
      const gap = 6;
      const size = (rect.width - 2*gap - (N-1)*gap) / N;
      floatText(`链合 +${reward}`, gap + tc*(size+gap) + size/2, gap + tr*(size+gap), '#ffb000');
      checkCombos(chainId, targetTier, [[tr, tc]]);
      checkWin();
      save();
    }, 250);
  }

  // ============ Coins / Score ============
  function gainScore(v) {
    score += v;
    scoreEl.textContent = score;
    if (score > best) { best = score; localStorage.setItem('sm_best', best); bestEl.textContent = best; }
  }
  function gainCoins(v) {
    if (v <= 0) return;
    coins += v;
    coinsEl.textContent = coins;
    sfx.coin();
  }

  // ============ Win check ============
  function checkWin() {
    for (const ch of CHAINS) {
      let hasMax = false;
      for (let r=0;r<N;r++) for (let c=0;c<N;c++) {
        const t = grid[r][c];
        if (t && t.chainId === ch.id && t.tier === TIERS_PER_CHAIN - 1) hasMax = true;
      }
      if (hasMax && !stats.maxedChains.has(ch.id)) {
        stats.maxedChains.add(ch.id);
        sfx.win();
        for (let i=0;i<10;i++) setTimeout(()=>sparkle(Math.floor(Math.random()*N),Math.floor(Math.random()*N),['#ffd54f','#ffb000']), i*80);
        if (stats.maxedChains.size === CHAINS.length) {
          setTimeout(() => {
            overlay.classList.add('show');
            overlayTitle.textContent = '🎉 大师甜点师！';
            overlayText.textContent = '你解锁了所有 3 条甜品链的最高等级';
          }, 500);
        } else {
          floatText(`${ch.name} 链通关！`, board.getBoundingClientRect().width/2, 100, ch.color);
        }
      }
    }
  }

  // ============ Locked cells ============
  function renderLockedCells() {
    [...gridEl.children].forEach((el, i) => {
      const r = Math.floor(i/N), c = i%N;
      const k = cellKey(r,c);
      el.classList.toggle('locked', locked.has(k));
      el.innerHTML = '';
      if (locked.has(k)) {
        const cost = unlockCost();
        el.innerHTML = `<div class="lk-icon">🔒</div><div class="lk-cost">🪙 ${cost}</div>`;
        el.onclick = () => tryUnlock(r, c);
      } else {
        el.onclick = null;
      }
    });
  }
  function unlockCost() {
    const totalCells = N*N;
    const unlocked = totalCells - locked.size;
    return UNLOCK_BASE_COST + (unlocked - 16) * 10;
  }
  function tryUnlock(r, c) {
    const cost = unlockCost();
    if (coins < cost) { sfx.bad(); floatText('金币不足', board.getBoundingClientRect().width/2, 100, '#ff5e9c'); return; }
    coins -= cost;
    coinsEl.textContent = coins;
    locked.delete(cellKey(r,c));
    renderLockedCells();
    sparkle(r, c, ['#ffd54f','#fff','#ffb000']);
    sfx.coin();
    save();
  }

  // ============ Orders ============
  function newOrder() {
    // Tier weighted: prefer low-mid tiers; require at least one item of that chain has been generated/seen
    const chain = CHAINS[Math.floor(Math.random()*CHAINS.length)];
    const maxTier = Math.min(3, Math.max(1, stats.bestTierByChain[chain.id] || 1));
    const tier = Math.floor(Math.random() * maxTier) + 1; // tier 1 to maxTier (0-index: 1..3)
    const tierIdx = Math.min(tier, TIERS_PER_CHAIN - 1);
    const reward = tierDef(chain.id, tierIdx).value * 3;
    return { id: ++orderIdSeq, chain: chain.id, tier: tierIdx, reward };
  }
  let orderIdSeq = 0;
  function ensureOrders() {
    while (orders.length < 3) orders.push(newOrder());
    renderOrders();
  }
  function renderOrders() {
    ordersEl.innerHTML = '';
    orders.forEach(o => {
      const def = tierDef(o.chain, o.tier);
      const card = document.createElement('div');
      card.className = 'order-card'; card.dataset.id = o.id;
      card.innerHTML = `
        <div class="preview">${def.svg}</div>
        <div class="info">
          <div class="name">${def.name}</div>
          <div class="reward">🪙 +${o.reward}</div>
        </div>`;
      ordersEl.appendChild(card);
    });
  }
  function deliverOrder(order, item) {
    sfx.coin();
    const idx = orders.findIndex(o => o.id === order.id);
    if (idx >= 0) orders.splice(idx, 1);
    const rect = item.el.getBoundingClientRect();
    const boardRect = board.getBoundingClientRect();
    floatText(`+${order.reward} 🪙`, rect.left - boardRect.left + rect.width/2, rect.top - boardRect.top, '#ffb000');
    gainCoins(order.reward);
    gainScore(order.reward);
    removeItem(item, true);
    ensureOrders();
    save();
  }

  // ============ Pointer/grid helpers ============
  function pointToRC(x, y) {
    const rect = gridEl.getBoundingClientRect();
    if (x < rect.left || y < rect.top || x > rect.right || y > rect.bottom) return null;
    const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap')) || 6;
    const size = (rect.width - (N-1)*gap) / N;
    const lx = x - rect.left, ly = y - rect.top;
    const c = Math.min(N-1, Math.max(0, Math.floor(lx / (size + gap))));
    const r = Math.min(N-1, Math.max(0, Math.floor(ly / (size + gap))));
    return { r, c };
  }
  function clearHover() {
    [...gridEl.querySelectorAll('.cell')].forEach(c => c.classList.remove('hover-empty','hover-merge','hover-bad'));
  }

  // ============ Save / Load ============
  function save() {
    // Update stats
    for (let r=0;r<N;r++) for (let c=0;c<N;c++) {
      const t = grid[r][c];
      if (t) {
        const cur = stats.bestTierByChain[t.chainId] || 0;
        if (t.tier > cur) stats.bestTierByChain[t.chainId] = t.tier;
      }
    }
    const data = {
      v: 1, score, coins, energy,
      lastEnergyTickAt: lastEnergyTickAt - performance.now(), // delta
      saveTime: Date.now(),
      locked: [...locked],
      orders, orderIdSeq,
      items: [...itemsById.values()].map(it => ({ id:it.id, chainId:it.chainId, tier:it.tier, r:it.r, c:it.c, bubbled:!!it.bubbled })),
      stats: { bestTierByChain: stats.bestTierByChain, maxedChains: [...stats.maxedChains] },
      nextId
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  }
  function load() {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    try {
      const d = JSON.parse(raw);
      if (d.v !== 1) return false;
      score = d.score || 0; coins = d.coins || 0; energy = d.energy ?? ENERGY_MAX;
      // Recompute energy regen during offline time
      const offline = (Date.now() - (d.saveTime || Date.now())) / 1;
      lastEnergyTickAt = performance.now() + (d.lastEnergyTickAt || 0);
      // give back offline energy
      if (offline > 0 && energy < ENERGY_MAX) {
        const gained = Math.floor(offline / ENERGY_REGEN_MS);
        energy = Math.min(ENERGY_MAX, energy + gained);
      }
      locked = new Set(d.locked || []);
      orders = d.orders || []; orderIdSeq = d.orderIdSeq || 0;
      stats = { bestTierByChain: d.stats?.bestTierByChain || {}, maxedChains: new Set(d.stats?.maxedChains || []) };
      nextId = d.nextId || 1;
      grid = Array.from({length:N}, () => Array(N).fill(null));
      itemsById = new Map();
      itemsEl.innerHTML = '';
      (d.items || []).forEach(s => {
        makeItem(s.chainId, s.tier, s.r, s.c, { id: s.id, bubbled: s.bubbled });
      });
      return true;
    } catch (e) { console.warn('load failed', e); return false; }
  }

  // ============ Init ============
  function init(fresh = true) {
    grid = Array.from({length:N}, () => Array(N).fill(null));
    itemsEl.innerHTML = '';
    itemsById = new Map();
    nextId = 1;
    score = 0; coins = 0;
    energy = ENERGY_MAX;
    lastEnergyTickAt = performance.now();
    // Initial lock: only top-left 4×4 unlocked (16 cells), rest locked
    locked = new Set();
    for (let r=0;r<N;r++) for (let c=0;c<N;c++) {
      if (r >= 4 || c >= 4) locked.add(cellKey(r,c));
    }
    orders = []; orderIdSeq = 0;
    stats = { bestTierByChain: {}, maxedChains: new Set() };
    overlay.classList.remove('show');
    scoreEl.textContent = 0;
    coinsEl.textContent = 0;
    bestEl.textContent = best;
    // Seed: 3 candy beans to start
    for (let i = 0; i < 3; i++) {
      const e = emptyUnlockedCells();
      if (!e.length) break;
      const [r, c] = e[Math.floor(Math.random() * e.length)];
      makeItem('candy', 0, r, c, { animate: true, bubbled: true });
    }
    renderLockedCells();
    ensureOrders();
    renderEnergy();
    save();
  }

  function applyTheme() {
    document.documentElement.setAttribute('data-theme', theme);
    $('theme').textContent = theme === 'dark' ? '☀️' : '🌙';
  }
  $('theme').onclick = () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('sm_theme', theme); applyTheme();
  };
  $('sound').onclick = () => {
    soundOn = !soundOn;
    localStorage.setItem('sm_sound', soundOn ? 'on' : 'off');
    $('sound').textContent = soundOn ? '🔊' : '🔇';
  };
  $('restart').onclick = () => {
    if (confirm('确定重新开始？当前进度会被清除')) {
      localStorage.removeItem(SAVE_KEY);
      init();
    }
  };
  $('overlay-btn').onclick = () => {
    localStorage.removeItem(SAVE_KEY);
    init();
  };

  applyTheme();
  $('sound').textContent = soundOn ? '🔊' : '🔇';
  if (!load()) init();
  else {
    scoreEl.textContent = score;
    coinsEl.textContent = coins;
    bestEl.textContent = best;
    renderLockedCells();
    ensureOrders();
    renderEnergy();
  }
  tickEnergy();
})();
</script>
</body>
</html>
